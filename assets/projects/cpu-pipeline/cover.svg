<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="cpu-title cpu-desc">
  <title id="cpu-title">Five-stage CPU pipeline diagram</title>
  <desc id="cpu-desc">Placeholder technical diagram of the instruction fetch, decode, execute, memory, and writeback pipeline stages.</desc>
  <defs>
    <pattern id="cpu-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12253f" stroke-opacity=".08" />
    </pattern>
    <marker id="cpu-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#12253f" />
    </marker>
  </defs>
  <rect width="640" height="420" fill="#e8eef5" />
  <rect width="640" height="420" fill="url(#cpu-grid)" />
  <rect x="0.5" y="0.5" width="639" height="419" fill="none" stroke="#12253f" stroke-opacity=".25" />

  <style>
    .instruction-token { animation: cpu-pipeline-advance 6s infinite; }
    @keyframes cpu-pipeline-advance {
      0% { transform: translateX(0); animation-timing-function: steps(4, jump-end); }
      75% { transform: translateX(491px); animation-timing-function: linear; }
      100% { transform: translateX(491px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .instruction-token { animation: none; }
    }
  </style>

  <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing=".05em" fill="#12253f" fill-opacity=".7">FIG. 04 &#8212; PIPELINE STAGES</text>
  <text x="616" y="34" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".04em" fill="#12253f" fill-opacity=".5">1 INSTRUCTION / CYCLE</text>

  <g stroke="#12253f" stroke-opacity=".3" stroke-width="1">
    <line x1="95" y1="150" x2="95" y2="164" />
    <line x1="223" y1="150" x2="223" y2="164" />
    <line x1="351" y1="150" x2="351" y2="164" />
    <line x1="479" y1="150" x2="479" y2="164" />
    <line x1="586" y1="150" x2="586" y2="164" />
  </g>
  <line x1="95" y1="165" x2="586" y2="165" stroke="#12253f" stroke-opacity=".3" stroke-width="1" stroke-dasharray="1 4" />
  <text x="95" y="146" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing=".04em" fill="#12253f" fill-opacity=".5">INSTRUCTION</text>
  <circle class="instruction-token" cx="95" cy="165" r="5" fill="#2f73ff" />

  <g font-family="'JetBrains Mono', monospace" font-size="13" letter-spacing=".04em" text-anchor="middle">
    <g transform="translate(48 180)">
      <rect width="94" height="94" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="47" y="52" fill="#12253f">IF</text>
      <text x="47" y="76" font-size="9" letter-spacing=".03em" fill="#12253f" fill-opacity=".5">FETCH</text>
    </g>
    <path d="M142 227h34" fill="none" stroke="#12253f" stroke-width="1.4" marker-end="url(#cpu-arrow)" />
    <g transform="translate(176 180)">
      <rect width="94" height="94" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="47" y="52" fill="#12253f">ID</text>
      <text x="47" y="76" font-size="9" letter-spacing=".03em" fill="#12253f" fill-opacity=".5">DECODE</text>
    </g>
    <path d="M270 227h34" fill="none" stroke="#12253f" stroke-width="1.4" marker-end="url(#cpu-arrow)" />
    <g transform="translate(304 180)">
      <rect width="94" height="94" fill="#2f73ff" fill-opacity=".1" stroke="#2f73ff" stroke-width="1.4" />
      <text x="47" y="52" fill="#1646a8">EX</text>
      <text x="47" y="76" font-size="9" letter-spacing=".03em" fill="#1646a8" fill-opacity=".7">EXECUTE</text>
    </g>
    <path d="M398 227h34" fill="none" stroke="#12253f" stroke-width="1.4" marker-end="url(#cpu-arrow)" />
    <g transform="translate(432 180)">
      <rect width="94" height="94" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="47" y="52" fill="#12253f">MEM</text>
      <text x="47" y="76" font-size="9" letter-spacing=".03em" fill="#12253f" fill-opacity=".5">MEMORY</text>
    </g>
    <path d="M526 227h34" fill="none" stroke="#12253f" stroke-width="1.4" marker-end="url(#cpu-arrow)" />
    <g transform="translate(560 180)">
      <rect width="52" height="94" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="26" y="52" fill="#12253f" font-size="11">WB</text>
    </g>
  </g>

  <text x="24" y="330" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".03em" fill="#12253f" fill-opacity=".55">MANUAL, VERSION-CONTROLLED IMPLEMENTATION &#8212; LOGISIM</text>

  <text x="616" y="400" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".03em" fill="#8e7928">PLACEHOLDER &#8212; REPLACE IN assets/projects/cpu-pipeline/</text>
</svg>
