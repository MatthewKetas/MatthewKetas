<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-labelledby="em-title em-desc">
  <title id="em-title">Bare-metal memory map diagram</title>
  <desc id="em-desc">Placeholder technical diagram of a bare-metal memory map: reset vector, interrupt vector, device I/O region, and main loop.</desc>
  <defs>
    <pattern id="em-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12253f" stroke-opacity=".08" />
    </pattern>
    <marker id="em-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#1646a8" />
    </marker>
  </defs>
  <rect width="640" height="420" fill="#e8eef5" />
  <rect width="640" height="420" fill="url(#em-grid)" />
  <rect x="0.5" y="0.5" width="639" height="419" fill="none" stroke="#12253f" stroke-opacity=".25" />

  <text x="24" y="34" font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing=".05em" fill="#12253f" fill-opacity=".7">FIG. 05 &#8212; MEMORY MAP</text>
  <text x="616" y="34" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".04em" fill="#12253f" fill-opacity=".5">4KB ADDRESS SPACE</text>

  <g font-family="'JetBrains Mono', monospace" font-size="14" fill="#12253f" fill-opacity=".35" text-anchor="middle">
    <text x="225" y="78">&#8942;</text>
    <text x="225" y="316">&#8942;</text>
  </g>

  <g stroke="#12253f" stroke-opacity=".3" stroke-width="1">
    <line x1="46" y1="90" x2="46" y2="298" />
    <line x1="40" y1="90" x2="46" y2="90" />
    <line x1="40" y1="142" x2="46" y2="142" />
    <line x1="40" y1="194" x2="46" y2="194" />
    <line x1="40" y1="246" x2="46" y2="246" />
    <line x1="40" y1="298" x2="46" y2="298" />
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".04em">
    <line x1="452" y1="220" x2="410" y2="220" stroke="#1646a8" stroke-width="1.3" marker-end="url(#em-arrow)" />
    <text x="458" y="224" fill="#1646a8">PC</text>
  </g>

  <g font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing=".03em">
    <g transform="translate(60 90)">
      <rect width="330" height="52" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="18" y="32" fill="#12253f" fill-opacity=".55">0x00</text>
      <text x="90" y="32" fill="#12253f">RESET</text>
    </g>
    <g transform="translate(60 142)">
      <rect width="330" height="52" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="18" y="32" fill="#12253f" fill-opacity=".55">0x04</text>
      <text x="90" y="32" fill="#12253f">VECTOR</text>
    </g>
    <g transform="translate(60 194)">
      <rect width="330" height="52" fill="#2f73ff" fill-opacity=".12" stroke="#2f73ff" stroke-width="1.4" />
      <text x="18" y="32" fill="#1646a8">0x08</text>
      <text x="90" y="32" fill="#12253f">DEVICE I/O</text>
    </g>
    <g transform="translate(60 246)">
      <rect width="330" height="52" fill="none" stroke="#12253f" stroke-width="1.4" />
      <text x="18" y="32" fill="#12253f" fill-opacity=".55">0x0C</text>
      <text x="90" y="32" fill="#12253f">LOOP</text>
    </g>
  </g>

  <text x="24" y="340" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".03em" fill="#12253f" fill-opacity=".55">BARE-METAL C &#8212; CODE COMPOSER STUDIO</text>

  <text x="616" y="400" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing=".03em" fill="#8e7928">PLACEHOLDER &#8212; REPLACE IN assets/projects/embedded-challenges/</text>
</svg>
